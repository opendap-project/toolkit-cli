[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/opendap-project/toolkit-cli"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
opendap-model = { path = "crates/opendap-model" }
opendap-cli-kit = { path = "crates/opendap-cli-kit" }
opendap-core = { path = "crates/opendap-core" }
opendap-host = { path = "crates/opendap-host" }
opendap-transport-ssh = { path = "crates/opendap-transport-ssh" }
opendap-transport-vm = { path = "crates/opendap-transport-vm" }
